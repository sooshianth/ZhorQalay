{% extends 'base.html' %}
{% load static %}

{% block head_styles %}
{{ block.super }}
<style>
    :root {
        --primary-color: #065F46;
        --button-color: #22C55E;
        --hover-color: #86EFAC;
        --background-color: #ECFDF5;
        --text-color: #0F172A;
        --border-color: #D1FAE5;
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }

    .proforma-wizard {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(6, 95, 70, 0.1);
        overflow: hidden;
    }

    .wizard-header {
        background: linear-gradient(135deg, var(--primary-color), #059669);
        color: white;
        padding: 30px;
        text-align: center;
    }

    .wizard-header h1 {
        margin: 0 0 15px 0;
        font-size: 28px;
    }

    .wizard-steps {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
    }

    .wizard-step {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 20px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 25px;
        font-size: 14px;
    }

    .wizard-step.active {
        background: white;
        color: var(--primary-color);
        font-weight: bold;
    }

    .wizard-step-number {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .wizard-step.active .wizard-step-number {
        background: var(--primary-color);
        color: white;
    }

    .wizard-content {
        padding: 40px;
    }

    .form-section {
        margin-bottom: 30px;
    }

    .form-section-title {
        font-size: 18px;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 8px;
    }

    .form-label.required::after {
        content: " *";
        color: #dc2626;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid var(--border-color);
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s;
        font-family: inherit;
    }

    .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(6, 95, 70, 0.1);
        outline: none;
    }

    textarea.form-control {
        resize: vertical;
        min-height: 100px;
    }

    .form-row {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    select.form-control {
        cursor: pointer;
    }

    .items-list {
        margin-top: 20px;
    }

    .item-card {
        background: var(--background-color);
        border: 2px solid var(--border-color);
        border-radius: 10px;
        padding: 20px;
        margin-bottom: 20px;
        position: relative;
    }

    .item-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--border-color);
    }

    .item-number {
        font-size: 18px;
        font-weight: bold;
        color: var(--primary-color);
    }

    .remove-item-btn {
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.3s;
    }

    .remove-item-btn:hover {
        background: #991b1b;
    }

    .add-item-btn {
        background: var(--button-color);
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        transition: all 0.3s;
    }

    .add-item-btn:hover {
        background: var(--hover-color);
        transform: translateY(-2px);
    }

    .calculation-box {
        background: linear-gradient(135deg, #fef3c7, #fde68a);
        border: 2px solid #f59e0b;
        border-radius: 12px;
        padding: 25px;
        margin-top: 30px;
    }

    .calculation-title {
        font-size: 20px;
        font-weight: bold;
        color: #92400e;
        margin-bottom: 15px;
        text-align: center;
    }

    .calculation-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        font-size: 16px;
    }

    .calculation-row.total {
        border-top: 3px solid #f59e0b;
        margin-top: 10px;
        padding-top: 15px;
        font-size: 20px;
        font-weight: bold;
        color: #065F46;
    }

    .wizard-actions {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 40px;
        padding-top: 30px;
        border-top: 2px solid var(--border-color);
    }

    .btn {
        padding: 12px 30px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border: none;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
    }

    .btn-primary {
        background: var(--button-color);
        color: white;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .btn-primary:hover {
        background: var(--hover-color);
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(34, 197, 94, 0.4);
    }

    .btn-secondary {
        background: #6b7280;
        color: white;
    }

    .btn-secondary:hover {
        background: #4b5563;
    }

    @media (max-width: 768px) {
        .form-row {
            grid-template-columns: 1fr;
        }

        .wizard-steps {
            flex-direction: column;
        }

        .wizard-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="proforma-wizard">
        <div class="wizard-header">
            <h1><i class="fas fa-file-invoice"></i> صدور پیش فاکتور</h1>
            <div class="wizard-steps">
                <div class="wizard-step">
                    <div class="wizard-step-number">✓</div>
                    <span>تایید اطلاعات</span>
                </div>
                <div class="wizard-step active">
                    <div class="wizard-step-number">2</div>
                    <span>انتخاب محصولات</span>
                </div>
                <div class="wizard-step">
                    <div class="wizard-step-number">3</div>
                    <span>پیش‌نمایش و تایید</span>
                </div>
            </div>
        </div>

        <div class="wizard-content">
            <form method="post" id="productForm">
                {% csrf_token %}
                <input type="hidden" name="items" id="items-json">

                <!-- لیست محصولات -->
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-boxes"></i>
                        محصولات
                    </div>

                    <div id="items-container" class="items-list">
                        <!-- آیتم‌های محصول به صورت پویا اضافه می‌شوند -->
                    </div>

                    <button type="button" class="add-item-btn" onclick="addItem()">
                        <i class="fas fa-plus"></i>
                        افزودن محصول جدید
                    </button>
                </div>

                <!-- محاسبه خودکار -->
                <div class="calculation-box">
                    <div class="calculation-title">
                        <i class="fas fa-calculator"></i> محاسبه قیمت کل
                    </div>
                    <div id="calc-items-list"></div>
                    <div class="calculation-row total">
                        <span>جمع کل:</span>
                        <span id="calc-grand-total">0 ریال</span>
                    </div>
                </div>

                <!-- ملاحظات -->
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="fas fa-sticky-note"></i>
                        ملاحظات
                    </div>

                    <div class="form-group">
                        <label class="form-label">ملاحظات (اختیاری):</label>
                        <textarea name="notes" class="form-control" 
                                  placeholder="توضیحات اضافی برای پیش فاکتور"></textarea>
                    </div>
                </div>

                <!-- دکمه‌های عملیات -->
                <div class="wizard-actions">
                    <a href="{% url 'proforma_step1' customer.id %}" class="btn btn-secondary">
                        <i class="fas fa-arrow-right"></i>
                        مرحله قبل
                    </a>
                    <button type="submit" class="btn btn-primary">
                        پیش‌نمایش
                        <i class="fas fa-arrow-left"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// آرایه محصولات (برای استفاده در فرم)
var allProducts = [];

// تبدیل QuerySet به آرایه JSON
{% if cargo_products %}
{% for product in cargo_products %}
allProducts.push({
        id: {{ product.id }},
        type: 'cargo',
        name: '{{ product.get_product_type_display|escapejs }} ({{ product.get_country_display|escapejs }})',
        cottage: '{{ product.cottage|escapejs }}',
        price: {{ product.customer_price|default:0 }},
        country: '{{ product.get_country_display|escapejs }}'
    });
    {% endfor %}
    {% endif %}

{% if non_bazargah_products %}
{% for product in non_bazargah_products %}
allProducts.push({
    id: {{ product.id }},
    type: 'non_bazargah',
    name: '{{ product.name|escapejs }}',
    cottage: '{{ product.cottage|default:""|escapejs }}',
    price: {{ product.purchase_price|default:0 }}
});
{% endfor %}
{% endif %}

console.log('محصولات بارگذاری شده:', allProducts.length);
console.log('محصولات:', allProducts);

// آرایه آیتم‌های فرم
var items = [];
var itemCounter = 0;

// اضافه کردن آیتم جدید
function addItem() {
    console.log('دکمه افزودن محصول کلیک شد');
    var itemId = itemCounter++;
    console.log('شناسه آیتم جدید:', itemId);
    
    const itemCard = document.createElement('div');
    itemCard.className = 'item-card';
    itemCard.id = `item-${itemId}`;
    
    // ایجاد گزینه‌های محصول
    let productOptions = '<option value="">-- انتخاب کنید (اختیاری) --</option>';
    if (allProducts && allProducts.length > 0) {
        productOptions += allProducts.map(p => 
            `<option value="${p.id}" data-type="${p.type}">${p.name} - ${p.cottage}</option>`
        ).join('');
    } else {
        productOptions += '<option value="" disabled>هیچ محصولی یافت نشد</option>';
    }
    
    itemCard.innerHTML = `
        <div class="item-card-header">
            <span class="item-number">محصول ${itemId + 1}</span>
            <button type="button" class="remove-item-btn" onclick="removeItem(${itemId})">
                <i class="fas fa-trash"></i> حذف
            </button>
        </div>
        
        <div class="form-group">
            <label class="form-label">محصول از لیست موجود:</label>
            <select class="form-control" onchange="selectProduct(${itemId}, this.value)">
                ${productOptions}
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label required">نام محصول:</label>
            <input type="text" class="form-control" id="name-${itemId}" placeholder="نام محصول را وارد کنید" required>
        </div>
        
        <div class="form-group">
            <label class="form-label">توضیحات محصول:</label>
            <textarea class="form-control" id="desc-${itemId}" placeholder="توضیحات تکمیلی (اختیاری)"></textarea>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label class="form-label required">مقدار:</label>
                <input type="number" class="form-control" id="qty-${itemId}" placeholder="مثال: 1000" step="0.01" required onchange="updateCalculations()">
            </div>
            
            <div class="form-group">
                <label class="form-label required">واحد:</label>
                <select class="form-control" id="unit-${itemId}" required onchange="updateCalculations()">
                    <option value="kg">کیلوگرم</option>
                    <option value="ton">تن</option>
                    <option value="bag">کیسه</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label class="form-label required">قیمت واحد (ریال):</label>
            <input type="number" class="form-control" id="price-${itemId}" placeholder="مثال: 50000" required onchange="updateCalculations()">
        </div>
        
        <input type="hidden" id="product-id-${itemId}" value="">
        <input type="hidden" id="product-type-${itemId}" value="">
    `;
    
    const container = document.getElementById('items-container');
    if (container) {
        container.appendChild(itemCard);
        console.log('آیتم با موفقیت اضافه شد');
        updateCalculations();
    } else {
        console.error('کانتینر آیتم‌ها یافت نشد');
    }
}

// حذف آیتم
function removeItem(itemId) {
    var itemCard = document.getElementById('item-' + itemId);
    if (itemCard) {
        itemCard.remove();
        updateCalculations();
    }
}

// انتخاب محصول از لیست
function selectProduct(itemId, productId) {
    console.log('انتخاب محصول:', productId, 'برای آیتم:', itemId);
    if (!productId) return;
    
    var product = allProducts.find(p => p.id == productId);
    if (!product) {
        console.log('محصول یافت نشد');
        return;
    }
    
    console.log('محصول انتخاب شده:', product);
    
    const nameField = document.getElementById('name-' + itemId);
    const priceField = document.getElementById('price-' + itemId);
    const productIdField = document.getElementById('product-id-' + itemId);
    const productTypeField = document.getElementById('product-type-' + itemId);
    
    if (nameField) nameField.value = product.name;
    if (priceField) priceField.value = product.price;
    if (productIdField) productIdField.value = productId;
    if (productTypeField) productTypeField.value = product.type;
    
    updateCalculations();
}

// بروزرسانی محاسبات
function updateCalculations() {
    console.log('بروزرسانی محاسبات شروع شد');
    const itemCards = document.querySelectorAll('.item-card');
    let grandTotal = 0;
    let calcItemsHtml = '';
    
    console.log('تعداد آیتم‌ها:', itemCards.length);
    
    itemCards.forEach((card, index) => {
        const itemId = card.id.split('-')[1];
        const qtyElement = document.getElementById(`qty-${itemId}`);
        const priceElement = document.getElementById(`price-${itemId}`);
        const unitElement = document.getElementById(`unit-${itemId}`);
        const nameElement = document.getElementById(`name-${itemId}`);
        
        const qty = parseFloat(qtyElement?.value || 0);
        const price = parseFloat(priceElement?.value || 0);
        const unit = unitElement?.selectedOptions[0]?.text || 'کیلوگرم';
        const name = nameElement?.value || `محصول ${index + 1}`;
        
        const lineTotal = qty * price;
        grandTotal += lineTotal;
        
        if (qty > 0 && price > 0) {
            calcItemsHtml += `
                <div class="calculation-row">
                    <span>${name}:</span>
                    <span>${lineTotal.toLocaleString('fa-IR')} ریال</span>
                </div>
            `;
        }
    });
    
    const calcItemsList = document.getElementById('calc-items-list');
    const calcGrandTotal = document.getElementById('calc-grand-total');
    
    if (calcItemsList) {
        calcItemsList.innerHTML = calcItemsHtml;
    }
    if (calcGrandTotal) {
        calcGrandTotal.textContent = `${grandTotal.toLocaleString('fa-IR')} ریال`;
    }
    
    console.log('محاسبات تکمیل شد. مجموع:', grandTotal);
}

// جمع‌آوری داده‌های فرم
function collectFormData() {
    console.log('جمع‌آوری داده‌های فرم شروع شد');
    const itemCards = document.querySelectorAll('.item-card');
    const items = [];
    
    console.log('تعداد کارت‌های آیتم:', itemCards.length);
    
    itemCards.forEach(card => {
        const itemId = card.id.split('-')[1];
        console.log('پردازش آیتم:', itemId);
        
        const productIdElement = document.getElementById(`product-id-${itemId}`);
        const productTypeElement = document.getElementById(`product-type-${itemId}`);
        const nameElement = document.getElementById(`name-${itemId}`);
        const descElement = document.getElementById(`desc-${itemId}`);
        const qtyElement = document.getElementById(`qty-${itemId}`);
        const unitElement = document.getElementById(`unit-${itemId}`);
        const priceElement = document.getElementById(`price-${itemId}`);
        
        const productId = productIdElement?.value || '';
        const productType = productTypeElement?.value || '';
        const name = nameElement?.value || '';
        const desc = descElement?.value || '';
        const qty = parseFloat(qtyElement?.value || 0);
        const unit = unitElement?.value || 'kg';
        const price = parseFloat(priceElement?.value || 0);
        
        console.log('داده‌های آیتم:', { name, qty, price });
        
        if (name && qty > 0 && price > 0) {
            items.push({
                product_id: productId,
                product_type: productType,
                product_name: name,
                product_description: desc,
                quantity: qty,
                unit: unit,
                unit_price: price
            });
        }
    });
    
    console.log('آیتم‌های جمع‌آوری شده:', items);
    return items;
}

// ارسال فرم
document.addEventListener('DOMContentLoaded', function() {
    console.log('صفحه بارگذاری شد');
    
    const form = document.getElementById('productForm');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('فرم ارسال شد');
            
            var items = collectFormData();
            
            if (items.length === 0) {
                alert('لطفاً حداقل یک محصول اضافه کنید.');
                return;
            }
            
            console.log('آیتم‌های نهایی:', items);
            document.getElementById('items-json').value = JSON.stringify(items);
            this.submit();
        });
    } else {
        console.error('فرم یافت نشد');
    }
    
    // اضافه کردن یک آیتم به صورت پیش‌فرض هنگام بارگذاری صفحه
    addItem();
});
</script>
{% endblock %}
