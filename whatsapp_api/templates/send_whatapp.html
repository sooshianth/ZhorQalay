{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">ارسال پیام واتساپ</h1>
    
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="recipient_number" class="form-label">شماره گیرنده</label>
                    <input type="text" class="form-control" id="recipient_number" name="recipient_number" 
                           placeholder="مثال: +989123456789" required>
                </div>

                <div class="mb-3">
                    <label for="template_type" class="form-label">نوع پیام</label>
                    <select class="form-select" id="template_type" name="template_type" required>
                        <option value="">انتخاب کنید</option>
                        {% for template in templates %}
                            <option value="{{ template.id }}">{{ template.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="customer_id" class="form-label">مشتری (اختیاری)</label>
                    <select class="form-select" id="customer_id" name="customer_id">
                        <option value="">انتخاب کنید</option>
                        {% for customer in customers %}
                            <option value="{{ customer.id }}">{{ customer.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">ارسال پیام</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
