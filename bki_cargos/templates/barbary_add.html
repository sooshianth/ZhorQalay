{% extends 'base.html' %}

{% block title %}ایجاد باربری جدید{% endblock %}

{% block content %}

{% load custom_filters %}

<style>
    .form-container {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #333;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .form-group input[type='checkbox'] {
        width: auto;
    }
    .btn-submit {
        background-color: #065F46;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }
    .btn-submit:hover {
        background-color: #065F46;
    }
    .btn-back {
        background-color: #f1f1f1;
        color: #333;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin-right: 10px;
        text-decoration: none;
        display: inline-block;
    }
    .btn-back:hover {
        background-color: #ddd;
    }
    .form-title {
        color: #333;
        text-align: center;
        margin-bottom: 20px;
    }
    .form-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
    }
</style>
<div class='form-container'>
    <h2 class="form-title">ایجاد باربری جدید</h2>
    <form method='post'>
        {% csrf_token %}
        <div class='form-group'>
            <label for='name'>نام:</label>
            <input type='text' id='name' name='name' required>
        </div>
        <div class='form-group'>
            <label for='phone_number'>شماره تماس:</label>
            <input type='text' id='phone_number' name='phone_number'>
        </div>
        <div class='form-group'>
            <label for='email'>ایمیل:</label>
            <input type='email' id='email' name='email'>
        </div>
        <div class='form-group'>
            <label for='description'>توضیحات:</label>
            <textarea id='description' name='description' rows="4"></textarea>
        </div>
        <div class='form-actions'>
            <a href="{% url 'barbary_list' %}" class="btn-back">
                <i class="fas fa-arrow-right"></i>
                بازگشت
            </a>
            <button type='submit' class='btn-submit'>
                <i class="fas fa-save"></i>
                ذخیره
            </button>
        </div>
    </form>
</div>

<script>
    // اضافه کردن آیکون‌های Font Awesome
    document.addEventListener('DOMContentLoaded', function() {
        // اگر لینک Font Awesome قبلاً اضافه نشده باشد، آن را اضافه کن
        if (!document.querySelector('link[href*="font-awesome"]')) {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css';
            document.head.appendChild(link);
        }
    });
</script>
{% endblock %}
