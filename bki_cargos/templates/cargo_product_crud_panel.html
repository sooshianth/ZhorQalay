{% extends 'base.html' %}

{% block title %}{% if product %}ویرایش محصول{% else %}ایجاد محصول جدید{% endif %}{% endblock %}

{% block content %}
<style>
    .form-container {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
        background-color: #f9f9f9;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    .form-group {
        margin-bottom: 15px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #333;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        box-sizing: border-box;
    }
    .form-group input[type='checkbox'] {
        width: auto;
    }
    .btn-submit {
        background-color: #4CAF50;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease;
    }
    .btn-submit:hover {
        background-color: #45a049;
    }
</style>
<div class='form-container'>
    <h2>{% if product %}ویرایش محصول{% else %}ایجاد محصول جدید{% endif %}</h2>
    <form method='post'>
        {% csrf_token %}
        <div class='form-group'>
            <label for='type'>نوع خرید:</label>
            <select id='type' name='type'>
                {% for value, label in purchase_types %}
                    <option value='{{ value }}' {% if product.type == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <label for='cottage'>کوتاژ:</label>
            <input type='text' id='cottage' name='cottage' value='{{ product.cottage }}'>
        </div>
        <div class='form-group'>
            <label for='company_price'>فی خرید (ریال):</label>
            <input type='number' id='company_price' name='company_price' value='{{ product.company_price }}'>
        </div>
        <div class='form-group'>
            <label for='customer_price'>فی فروش (ریال):</label>
            <input type='number' id='customer_price' name='customer_price' value='{{ product.customer_price }}'>
        </div>
        <div class='form-group'>
            <label for='product_type'>نوع محصول:</label>
            <select id='product_type' name='product_type'>
                {% for value, label in product_types %}
                    <option value='{{ value }}' {% if product.product_type == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <label for='country'>کشور:</label>
            <select id='country' name='country'>
                {% for value, label in countries %}
                    <option value='{{ value }}' {% if product.country == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <label for='vared_konandeh'>واردکننده:</label>
            <select id='vared_konandeh' name='vared_konandeh'>
                <option value=''>انتخاب کنید</option>
                {% for vared_konandeh in vared_konandehs %}
                    <option value='{{ vared_konandeh.id }}' {% if product.vared_konandeh_id == vared_konandeh.id %}selected{% endif %}>{{ vared_konandeh.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <label for='barbary'>باربری:</label>
            <select id='barbary' name='barbary'>
                <option value=''>انتخاب کنید</option>
                {% for barbary in barbaries %}
                    <option value='{{ barbary.id }}' {% if product.barbary_id == barbary.id %}selected{% endif %}>{{ barbary.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <label for='port'>محل بارگیری:</label>
            <select id='port' name='port'>
                {% for value, label in ports %}
                    <option value='{{ value }}' {% if product.port == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class='form-group'>
            <label for='loading_time'>زمان بارگیری:</label>
            <input type='text' id='loading_time' name='loading_time' value='{{ product.loading_time }}'>
        </div>
        <div class='form-group'>
            <label for='description'>توضیحات:</label>
            <textarea id='description' name='description'>{{ product.description }}</textarea>
        </div>
        <div class='form-group'>
            <label for='weight'>وزن موجود:</label>
            <input type='number' id='weight' name='weight' value='{{ product.weight }}'>
        </div>
        <div class='form-group'>
            <label for='status'>وضعیت:</label>
            <input type='checkbox' id='status' name='status' {% if product.status %}checked{% endif %}>
        </div>
        <button type='submit' class='btn-submit'>{% if product %}به‌روزرسانی{% else %}ایجاد{% endif %}</button>
    </form>
</div>
{% endblock %}
