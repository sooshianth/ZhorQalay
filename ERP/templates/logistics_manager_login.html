{% extends "base.html" %}

{% block title %}ورود مدیران لجستیک{% endblock %}

{% block content %}
    <div class="login-container">
        <h2>ورود به حساب مدیر لجستیک</h2>

        <form method="POST">
            {% csrf_token %}
            
            {% if verification_step %}
                <p>کد تایید به شماره {{ request.session.phone_number }} ارسال شد.</p>
                <input type="hidden" name="phone_number" value="{{ request.session.phone_number }}">
                <input type="hidden" name="user_type" value="logistics_manager">
                <div class="form-group">
                    <label for="id_verification_code">کد تایید:</label>
                    <input type="text" name="verification_code" maxlength="6" required id="id_verification_code">
                </div>
                <button type="submit">تایید</button>
            {% else %}
                {{ form.as_p }}
                <button type="submit">دریافت کد تایید</button>
            {% endif %}
        </form>
    </div>
{% endblock %}
