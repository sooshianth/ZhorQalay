; Sample Asterisk Dialplan for CRM Integration
; Place this in your extensions.conf file

[globals]
API_NOTIFIER=/path/to/api_notifier.py  ; Update with the actual path to the script

[from-internal]
; Example for outbound call
exten => _9.,1,NoOp(Outbound call to ${EXTEN:1})
    same => n,Set(CUSTOMER_NUMBER=${EXTEN:1})
    same => n,Set(UNIQUEID=${UNIQUEID})
    same => n,System(${API_NOTIFIER} call_initiated ${UNIQUEID} ${CUSTOMER_NUMBER} outbound)
    same => n,Dial(SIP/${CUSTOMER_NUMBER},30)
    same => n,Goto(handle-dial-status,${DIALSTATUS},1)
    same => n,Hangup()

[from-external]
; Example for inbound call
exten => _.,1,NoOp(Inbound call from ${CALLERID(num)})
    same => n,Set(CUSTOMER_NUMBER=${CALLERID(num)})
    same => n,Set(UNIQUEID=${UNIQUEID})
    same => n,System(${API_NOTIFIER} call_initiated ${UNIQUEID} ${CUSTOMER_NUMBER} inbound)
    same => n,Answer()
    same => n,Goto(ivr-main,s,1)
    same => n,Hangup()

[ivr-main]
exten => s,1,NoOp(Main IVR)
    same => n,System(${API_NOTIFIER} customer_answer ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Background(welcome-to-our-system)
    same => n,WaitExten(10)
    same => n,Goto(timeout,1)

exten => 1,1,NoOp(Customer selected option 1)
    same => n,System(${API_NOTIFIER} customer_dtmf ${UNIQUEID} ${CUSTOMER_NUMBER} 1)
    same => n,Goto(sales-queue,s,1)

exten => 2,1,NoOp(Customer selected option 2)
    same => n,System(${API_NOTIFIER} customer_dtmf ${UNIQUEID} ${CUSTOMER_NUMBER} 2)
    same => n,Goto(support-queue,s,1)

exten => timeout,1,NoOp(Customer did not select an option)
    same => n,Playback(sorry-no-option-selected)
    same => n,Goto(operator-queue,s,1)

exten => h,1,NoOp(Customer hung up during IVR)
    same => n,System(${API_NOTIFIER} customer_hung_up_pre_ivr ${UNIQUEID} ${CUSTOMER_NUMBER})

[sales-queue]
exten => s,1,NoOp(Entering sales queue)
    same => n,System(${API_NOTIFIER} customer_entered_queue ${UNIQUEID} ${CUSTOMER_NUMBER} 2000)
    same => n,Queue(sales)
    same => n,Hangup()

exten => h,1,NoOp(Customer hung up in sales queue)
    same => n,Set(QUEUE_DURATION=${QUEUETIME})
    same => n,System(${API_NOTIFIER} customer_hung_up_in_queue ${UNIQUEID} ${CUSTOMER_NUMBER} ${QUEUE_DURATION})

[support-queue]
exten => s,1,NoOp(Entering support queue)
    same => n,System(${API_NOTIFIER} customer_entered_queue ${UNIQUEID} ${CUSTOMER_NUMBER} 3000)
    same => n,Queue(support)
    same => n,Hangup()

exten => h,1,NoOp(Customer hung up in support queue)
    same => n,Set(QUEUE_DURATION=${QUEUETIME})
    same => n,System(${API_NOTIFIER} customer_hung_up_in_queue ${UNIQUEID} ${CUSTOMER_NUMBER} ${QUEUE_DURATION})

[operator-queue]
exten => s,1,NoOp(Entering operator queue)
    same => n,System(${API_NOTIFIER} customer_entered_queue ${UNIQUEID} ${CUSTOMER_NUMBER} 1000)
    same => n,Queue(operator)
    same => n,Hangup()

exten => h,1,NoOp(Customer hung up in operator queue)
    same => n,Set(QUEUE_DURATION=${QUEUETIME})
    same => n,System(${API_NOTIFIER} customer_hung_up_in_queue ${UNIQUEID} ${CUSTOMER_NUMBER} ${QUEUE_DURATION})

[handle-dial-status]
; Handle different dial statuses for outbound calls
exten => ANSWER,1,NoOp(Call was answered)
    same => n,System(${API_NOTIFIER} customer_answer ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Hangup()

exten => BUSY,1,NoOp(Customer was busy)
    same => n,System(${API_NOTIFIER} customer_busy ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Hangup()

exten => NOANSWER,1,NoOp(Customer did not answer)
    same => n,System(${API_NOTIFIER} customer_no_answer ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Hangup()

exten => CONGESTION,1,NoOp(Network congestion)
    same => n,System(${API_NOTIFIER} call_failed ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Hangup()

exten => CHANUNAVAIL,1,NoOp(Channel unavailable)
    same => n,System(${API_NOTIFIER} call_failed ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Hangup()

exten => _.,1,NoOp(Other dial status: ${EXTEN})
    same => n,System(${API_NOTIFIER} call_failed ${UNIQUEID} ${CUSTOMER_NUMBER})
    same => n,Hangup()

; Agent handling macro
[macro-handle-agent-connect]
exten => s,1,NoOp(Agent ${ARG1} connected to call from ${ARG2})
    same => n,System(${API_NOTIFIER} agent_answer ${UNIQUEID} ${ARG2} ${ARG1})
    same => n,Set(CHANNEL(hangup_handler_push)=agent-hangup,s,1(${UNIQUEID},${ARG2},${ARG1}))
    same => n,Return()

; Agent hangup handler
[agent-hangup]
exten => s,1,NoOp(Call ended between agent ${ARG3} and customer ${ARG2})
    same => n,Set(CALL_DURATION=${ANSWEREDTIME})
    same => n,System(${API_NOTIFIER} call_end ${ARG1} ${ARG2} ${ARG3} ${CALL_DURATION})
    same => n,Return()
