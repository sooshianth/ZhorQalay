{% extends "base.html" %}
    
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card mt-5">
                <div class="card-header text-center">
                    <h3>ورود به سامانه</h3>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="text-right" dir="rtl">
                        {% csrf_token %}

                        {% if not verification_step %}
                        <div class="form-group mb-3">
                            <label for="{{ form.phone_number.id_for_label }}" class="font-weight-bold">شماره موبایل</label>
                            {{ form.phone_number }}
                        </div>
                        {% else %}
                        <!-- در مرحله تایید، شماره موبایل را به صورت مخفی ارسال می‌کنیم -->
                        <input type="hidden" name="phone_number" value="{{ form.phone_number.value }}" />
                        <div class="alert alert-info mb-3">
                            کد تایید به شماره <strong>{{ form.phone_number.value }}</strong> ارسال شد.
                        </div>
                        {% endif %}

                        {% if verification_step %}
                        <div class="form-group mb-3">
                            <label for="{{ form.verification_code.id_for_label }}" class="font-weight-bold">کد تایید</label>
                            {{ form.verification_code }}
                        </div>
                        {% endif %}

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success">
                                {% if verification_step %}
                                ورود
                                {% else %}
                                ارسال کد تایید
                                {% endif %}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
