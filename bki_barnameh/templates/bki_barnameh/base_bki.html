{% extends 'base.html' %}
{% load static %}

{% block head_styles %}
    {{ block.super }}
    <!-- اضافه کردن استایل‌های بوت‌استرپ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- استایل‌های سفارشی برای bki_barnameh -->
    <style>
        /* گرادیانت‌های رنگی برای هدر کارت‌ها */
        .bg-gradient-primary {
            background: linear-gradient(135deg, #065F46 0%, #047857 100%);
        }
        
        .bg-gradient-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        
        .bg-gradient-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        
        .bg-gradient-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .bg-gradient-info {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
        
        /* بهبود ظاهر کارت‌ها */
        .card {
            overflow: visible !important;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1) !important;
        }
        
        /* بهبود ظاهر دکمه‌ها */
        .btn {
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        /* رفع مشکل دکمه disabled */
        .btn.disabled, .btn:disabled {
            opacity: 0.65;
            pointer-events: none !important;
            transform: none;
            cursor: not-allowed !important;
        }
        
        /* بهبود ظاهر جداول */
        .table th {
            font-weight: 600;
        }
        
        /* فعال کردن تولتیپ‌ها */
        [data-bs-toggle="tooltip"] {
            cursor: pointer;
        }
        
        /* رفع مشکل اسکرول صفحات طولانی */
        main.container {
            overflow: visible !important;
            max-height: none !important;
            height: auto !important;
            margin-bottom: 100px !important; /* افزایش فاصله از فوتر */
        }
        
        .card-body {
            overflow: visible !important;
            max-height: none !important;
            padding: 1rem !important; /* کاهش پدینگ داخلی کارت‌ها */
        }
        
        body {
            overflow-y: auto !important;
            height: auto !important;
            min-height: 100vh !important;
            padding-bottom: 100px !important; /* افزایش پدینگ پایین بدنه */
        }
        
        html {
            overflow-y: auto !important;
            height: auto !important;
        }
        
        /* اطمینان از نمایش کامل کارت‌ها */
        .row {
            overflow: visible !important;
        }
        
        .col-md-6 {
            margin-bottom: 15px; /* کاهش فاصله بین ستون‌ها */
        }
        
        /* رفع مشکل اسکرول در جداول */
        .table-responsive {
            overflow-x: auto !important;
            max-height: none !important;
        }
        
        /* رفع مشکل نمایش کارت‌ها در صفحه ویرایش */
        .card.h-100 {
            height: auto !important;
            min-height: auto !important; /* تغییر از 100% به auto */
            display: flex;
            flex-direction: column;
        }
        
        /* رفع مشکل نمایش dropdown منوی عملیات گروهی */
        .dropdown-menu {
            z-index: 1021;
            display: none;
        }
        
        .dropdown-menu.show {
            display: block !important;
        }
        
        /* بهبود نمایش آیتم‌های منوی کشویی */
        .dropdown-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            display: block;
            width: 100%;
            text-align: right;
        }
        
        .dropdown-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        
        /* بهبود نمایش چک‌باکس‌ها */
        .form-check-input {
            cursor: pointer;
        }
        
        /* کاهش اندازه فرم‌ها و فیلدها */
        .form-control, .input-group {
            padding: 0.375rem 0.5rem;
            font-size: 0.9rem;
        }
        
        .input-group-text {
            padding: 0.375rem 0.5rem;
            font-size: 0.9rem;
        }
        
        .form-label {
            margin-bottom: 0.25rem;
        }
        
        .mb-3 {
            margin-bottom: 0.75rem !important;
        }
        
        /* کاهش فاصله بین کارت‌ها */
        .mt-4 {
            margin-top: 1rem !important;
        }
        
        .g-4 {
            --bs-gutter-y: 1rem !important;
        }
        
        /* اطمینان از عدم تداخل با فوتر */
        footer {
            position: relative !important;
            z-index: 1 !important;
        }
        
        /* تنظیم ارتفاع فیلدهای ورودی */
        .form-control, .form-select, .input-group-text, .btn-sm {
            line-height: 1.2;
            height: auto;
        }
        
        /* استایل اختصاصی برای دکمه عملیات گروهی */
        #bulk-action-btn {
            transition: all 0.3s ease;
        }
        
        #bulk-action-btn:not(.disabled):not(:disabled) {
            opacity: 1 !important;
            pointer-events: auto !important;
            cursor: pointer !important;
        }
        
        #bulk-action-btn.disabled, #bulk-action-btn:disabled {
            opacity: 0.65 !important;
            pointer-events: none !important;
            cursor: not-allowed !important;
        }
    </style>
{% endblock %}

{% block extra_scripts %}
    <!-- اضافه کردن jQuery قبل از بوت‌استرپ -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- اضافه کردن اسکریپت‌های بوت‌استرپ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- اسکریپت برای فعال‌سازی تولتیپ‌ها -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // فعال‌سازی تولتیپ‌ها
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl)
            });
            
            // فعال‌سازی منوهای کشویی
            var dropdownElementList = [].slice.call(document.querySelectorAll('.dropdown-toggle'))
            var dropdownList = dropdownElementList.map(function (dropdownToggleEl) {
                return new bootstrap.Dropdown(dropdownToggleEl)
            });
            
            // بررسی وضعیت چک‌باکس‌ها و دکمه عملیات گروهی
            function checkBulkActionButton() {
                var checkedCount = $('.barnameh-checkbox:checked').length;
                if (checkedCount > 0) {
                    $('#bulk-action-btn').prop('disabled', false);
                    $('#bulk-action-btn').removeClass('disabled');
                    $('#bulk-action-btn').css('opacity', '1');
                    $('#bulk-action-btn').css('pointer-events', 'auto');
                    $('#bulk-action-btn').css('cursor', 'pointer');
                } else {
                    $('#bulk-action-btn').prop('disabled', true);
                    $('#bulk-action-btn').addClass('disabled');
                    $('#bulk-action-btn').css('opacity', '0.65');
                    $('#bulk-action-btn').css('pointer-events', 'none');
                    $('#bulk-action-btn').css('cursor', 'not-allowed');
                }
            }
            
            // اجرای تابع بررسی در زمان‌های مختلف
            setTimeout(checkBulkActionButton, 100);
            setTimeout(checkBulkActionButton, 500);
            setTimeout(checkBulkActionButton, 1000);
            
            // بررسی مجدد پس از بارگذاری کامل صفحه
            $(window).on('load', function() {
                checkBulkActionButton();
                
                // اصلاح ارتفاع کارت‌ها
                $('.card.h-100').css('height', 'auto').css('min-height', 'auto');
                
                // اطمینان از فاصله کافی با فوتر
                $('main.container').css('margin-bottom', '100px');
                $('body').css('padding-bottom', '100px');
                
                // رفع مشکل دکمه عملیات گروهی
                $(document).on('change', '.barnameh-checkbox', function() {
                    checkBulkActionButton();
                });
                
                // اضافه کردن قابلیت کلیک روی ردیف‌ها
                $(document).on('click', 'tr.align-middle td', function(e) {
                    if (!$(e.target).is('input, a, button, i')) {
                        var checkbox = $(this).closest('tr').find('.barnameh-checkbox');
                        checkbox.prop('checked', !checkbox.prop('checked'));
                        checkbox.trigger('change');
                    }
                });
                
                // رفع مشکل منوی کشویی
                $('.dropdown-toggle').on('click', function(e) {
                    e.stopPropagation();
                    var dropdown = new bootstrap.Dropdown(this);
                    $('.dropdown-toggle').not(this).each(function() {
                        var otherDropdown = bootstrap.Dropdown.getInstance(this);
                        if (otherDropdown) otherDropdown.hide();
                    });
                });
                
                // رفع مشکل آیتم‌های منوی کشویی
                $('.dropdown-item').on('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    var action = $(this).attr('id');
                    console.log('کلیک روی آیتم منو:', action);
                    
                    // بستن منوی کشویی
                    var dropdownEl = $(this).closest('.dropdown').find('.dropdown-toggle')[0];
                    var dropdown = bootstrap.Dropdown.getInstance(dropdownEl);
                    if (dropdown) dropdown.hide();
                    
                    // اجرای عملیات مربوطه
                    if (action === 'bulk-send-btn') {
                        $('#bulk-send-btn').trigger('click');
                    } else if (action === 'bulk-export-btn') {
                        $('#bulk-export-btn').trigger('click');
                    } else if (action === 'bulk-edit-btn') {
                        $('#bulk-edit-btn').trigger('click');
                    }
                });
            });
        });
    </script>
    {{ block.super }}
{% endblock %}
