{% extends 'core/base.html' %}
{% load static %}

{% block title %}ایجاد بارنامه جدید{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
            <i class="fas fa-plus me-2"></i>
            ایجاد بارنامه جدید
        </h5>
        <div>
            <a href="{% url 'barnameh_list' %}" class="btn btn-secondary btn-sm">
                <i class="fas fa-arrow-right me-1"></i>
                بازگشت به لیست
            </a>
        </div>
    </div>
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h6 class="mb-0">اطلاعات بارنامه</h6>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="number" class="form-label">شماره بارنامه <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="number" name="number" required>
                            </div>
                            <div class="mb-3">
                                <label for="serial" class="form-label">سریال بارنامه <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="serial" name="serial" required>
                            </div>
                            <div class="mb-3">
                                <label for="tonnage" class="form-label">وزن (تن) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="tonnage" name="tonnage" required>
                            </div>
                            <div class="mb-3">
                                <label for="barnameh_date" class="form-label">تاریخ بارنامه (مثال: 1402/01/01)</label>
                                <input type="text" class="form-control" id="barnameh_date" name="barnameh_date" placeholder="1402/01/01">
                            </div>
                        </div>
                    </div>
                    
                    <div class="card mb-4">
                        <div class="card-header">
                            <h6 class="mb-0">اطلاعات خرید و تخصیص</h6>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="purchase_number" class="form-label">شناسه خرید <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="purchase_number" name="purchase_number" required>
                            </div>
                            <div class="mb-3">
                                <label for="shenase_takhsis_code" class="form-label">شناسه تخصیص <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="shenase_takhsis_code" name="shenase_takhsis_code" required>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h6 class="mb-0">اطلاعات حمل و نقل</h6>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="driver_name" class="form-label">نام راننده</label>
                                <input type="text" class="form-control" id="driver_name" name="driver_name">
                            </div>
                            <div class="mb-3">
                                <label for="driver_phone" class="form-label">شماره تلفن راننده</label>
                                <input type="text" class="form-control" id="driver_phone" name="driver_phone">
                            </div>
                            <div class="mb-3">
                                <label for="vehicle_plate" class="form-label">پلاک خودرو</label>
                                <input type="text" class="form-control" id="vehicle_plate" name="vehicle_plate">
                            </div>
                            <div class="mb-3">
                                <label for="receiver_name" class="form-label">نام گیرنده</label>
                                <input type="text" class="form-control" id="receiver_name" name="receiver_name">
                            </div>
                            <div class="mb-3">
                                <label for="destination" class="form-label">مقصد</label>
                                <input type="text" class="form-control" id="destination" name="destination">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>
                    ذخیره
                </button>
                <a href="{% url 'barnameh_list' %}" class="btn btn-secondary">
                    <i class="fas fa-times me-1"></i>
                    انصراف
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
