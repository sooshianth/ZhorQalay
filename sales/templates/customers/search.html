<!-- search.html -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            جستجوی مشتری
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.phone_number.label_tag }}
                    {{ form.phone_number }}
                    <small class="form-text text-muted">شماره باید با 9 شروع شود و 10 رقمی باشد</small>
                </div>
                <button type="submit" class="btn btn-success">جستجو</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
