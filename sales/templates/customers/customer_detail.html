<!-- customer_detail.html -->
{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-warning">
            اطلاعات مشتری
        </div>
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">نام:</dt>
                <dd class="col-sm-9">{{ customer.name }}</dd>

                <dt class="col-sm-3">شماره تماس:</dt>
                <dd class="col-sm-9">{{ customer.phone_number }}</dd>

                <dt class="col-sm-3">شهر:</dt>
                <dd class="col-sm-9">{{ customer.city }}</dd>

                <dt class="col-sm-3">زمینه فعالیت:</dt>
                <dd class="col-sm-9">
                    {% for activity in customer.field_of_activity %}
                    <span class="badge badge-secondary">{{ activity }}</span>
                    {% endfor %}
                </dd>
            </dl>
            <a href="{% url 'customer_search' %}" class="btn btn-light">بازگشت</a>
        </div>
    </div>
</div>
{% endblock %}
