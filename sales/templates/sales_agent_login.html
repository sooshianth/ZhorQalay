{% extends "base.html" %}

{% block title %}ورود کارشناسان فروش{% endblock %}

{% block content %}
    <div class="login-container">
        <h2>ورود به حساب کارشناس فروش</h2>

        {% if messages %}
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>
        {% endfor %}
        {% endif %}
    
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}  <!-- نمایش خودکار فرم شامل کپچا -->
            <button type="submit">ورود</button>
        </form>
    </div>
{% endblock %}
