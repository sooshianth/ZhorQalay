{% extends 'base.html' %}

{% block title %}لیست مشتریان{% endblock %}

{% block content %}
<h1>لیست مشتریان</h1>

<!-- فرم جستجو -->
<form method="get" action="{% url 'customer_list' %}">
    <input type="text" name="search" placeholder="جستجو بر اساس نام یا شماره موبایل" value="{{ request.GET.search }}">
    <button type="submit">جستجو</button>
</form>

<!-- نمایش لیست مشتریان در جدول -->
<table>
    <thead>
        <tr>
            <th>
                <div class="sortable">
                    نام 
                    <a href="?search={{ search_query }}&sort=name&order=asc" class="sort-btn {% if sort_by == 'name' and order == 'asc' %}active{% endif %}">🔼</a>
                    <a href="?search={{ search_query }}&sort=name&order=desc" class="sort-btn {% if sort_by == 'name' and order == 'desc' %}active{% endif %}">🔽</a>
                </div>
            </th>
            <th>
                <div class="sortable">
                    شماره موبایل
                    <a href="?search={{ search_query }}&sort=phone&order=asc" class="sort-btn {% if sort_by == 'phone' and order == 'asc' %}active{% endif %}">🔼</a>
                    <a href="?search={{ search_query }}&sort=phone&order=desc" class="sort-btn {% if sort_by == 'phone' and order == 'desc' %}active{% endif %}">🔽</a>
                </div>
            </th>
        </tr>
    </thead>
    <tbody>
        {% for customer in customers %}
            <tr>
                <td><a href="{% url 'general_customer_CRUD' %}?customer_id={{ customer.id }}" >{{ customer.name }}</a></td>
                <td>{{ customer.phone_number }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="2">مشتری‌ای یافت نشد</td>
            </tr>
        {% endfor %}
    </tbody>
</table>

<!-- لینک بازگشت به پروفایل -->
<a href="{% url 'sales_agent_profile' %}">بازگشت به پروفایل</a>
{% endblock %}
