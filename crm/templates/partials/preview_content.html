<div class="file-info-card">
    <p><strong>نام فایل:</strong> {{ bge_file.file.name }}</p>
    <p><strong>تعداد ردیف‌ها:</strong> {{ total_rows }}</p>
    <p><strong>تعداد ستون‌ها:</strong> {{ total_columns }}</p>
    <p><strong>اندازه فایل:</strong> {{ file_size }}</p>
</div>
<div class="preview-table">
    {{ table_html|safe }}
</div>
{% if not bge_file.is_approved %}
<div class="action-footer">
    <button id="approveTrigger" class="btn btn-success" data-file-id="{{ file_id }}">
        <span class="approve-text">تأیید فایل</span>
        <span class="approve-loader spinner-border spinner-border-sm" style="display: none;"></span>
    </button>
</div>
{% endif %}

<script>
    previewContent.addEventListener('click', function(e) {
    if (e.target.id === 'approveTrigger') {
        const fileId = e.target.getAttribute('data-file-id');
        const approveText = e.target.querySelector('.approve-text');
        const approveLoader = e.target.querySelector('.approve-loader');
        
        approveText.style.display = 'none';
        approveLoader.style.display = 'inline-block';
        e.target.disabled = true;

        fetch(`/approve_bge_file/${fileId}/`, {
            method: 'POST',
            headers: {
                'X-CSRFToken': getCSRFCookie(),
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                previewModal.hide();
                location.reload();  // رفرش صفحه بعد از تأیید
            } else {
                alert(data.message);
            }
        })
        .catch(error => alert('خطا در تأیید فایل'))
        .finally(() => {
            approveText.style.display = 'inline-block';
            approveLoader.style.display = 'none';
            e.target.disabled = false;
        });
    }
});

function getCSRFCookie() {
    return document.cookie.split('; ')
        .find(row => row.startsWith('csrftoken'))
        ?.split('=')[1];
}
</script>
