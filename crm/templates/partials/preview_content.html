<div class="preview-table">
    {{ table_html|safe }}
</div>
<p class="text-muted small mt-3">
    تعداد ردیف‌ها: {{ total_rows }} | تعداد ستون‌ها: {{ total_columns }} | حجم فایل: {{ file_size }}
</p>
{% if not bge_file.is_approved %}
    <button id="approveBtn" class="btn btn-success mt-3" data-file-id="{{ file_id }}">
        تأیید فایل
    </button>
{% endif %}

<script>
document.getElementById('approveBtn')?.addEventListener('click', function() {
    const fileId = this.getAttribute('data-file-id');
    fetch(`/approve_bge_file/${fileId}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            alert(data.message);
            window.location.reload();  // رفرش صفحه بعد از تأیید
        } else {
            alert(data.message);
        }
    })
    .catch(error => alert('خطا در تأیید فایل'));
});
</script>
