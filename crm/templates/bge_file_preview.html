{% extends 'base.html' %}
{% load static %}

{% block title %}پیش‌نمایش فایل اکسل بازارگاه{% endblock %}

{% block content %}
<style>
/* استایل‌های قبلی با بهبودهای جزئی */
.file-info-card {
    background: #f8f9fa;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    border: 1px solid #dee2e6;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
}

.preview-table {
    max-height: 65vh;
    overflow-y: auto;
    border: 2px solid #dee2e6;
    border-radius: 8px;
    position: relative;
}

.loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.action-footer {
    /* ... استایل‌های قبلی ... */
    backdrop-filter: blur(5px);
}
</style>

<div class="container-lg py-4">
    <!-- Hidden CSRF Token Form -->
    <form id="csrf-form" style="display: none;">{% csrf_token %}</form>
    
    <div class="card border-0 shadow-lg">
        <!-- بقیه کدهای هدر و بدنه بدون تغییر -->
        
        <!-- پاورقی عملیات با بهبودهای UI -->
        <div class="action-footer">
            <div class="container">
                <div class="row g-3 align-items-center">
                    <div class="col-6 col-md-4">
                        <a href="{% url 'download_bge_file' bge_file.id %}" 
                           class="btn btn-secondary w-100 py-2 hover-effect"
                           data-bs-toggle="tooltip" 
                           title="دانلود فایل خام">
                            <i class="bi bi-file-earmark-arrow-down me-2"></i>دانلود
                        </a>
                    </div>
                    <div class="col-6 col-md-8">
                        {% if not bge_file.is_approved %}
                        <button class="btn btn-success w-100 py-2 hover-effect" 
                                id="approveTrigger"
                                data-file-id="{{ bge_file.id }}"
                                data-cargo-name="{{ bge_file.cargo }}"
                                data-bs-toggle="tooltip"
                                title="پس از تأیید امکان ویرایش وجود نخواهد داشت">
                            <span class="approve-loader" style="display:none;">
                                <span class="spinner-border spinner-border-sm" role="status"></span>
                                در حال تأیید...
                            </span>
                            <span class="approve-text">
                                <i class="bi bi-shield-check me-2"></i>تایید نهایی فایل
                            </span>
                        </button>
                        {% else %}
                        <div class="alert alert-success mb-0 text-center">
                            <i class="bi bi-file-lock2 me-2"></i>
                            این فایل در تاریخ {{ bge_file.updated_at|date:"Y/m/d H:i" }} تایید شده است
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- بهبود یافته Modal تایید -->
<div class="modal fade" id="approvalModal" data-bs-backdrop="static" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- محتوای Modal بدون تغییر -->
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // تابع دریافت CSRF Token
    function getCSRFCookie() {
        const cookieValue = document.querySelector('#csrf-form input[name="csrfmiddlewaretoken"]').value;
        return cookieValue;
    }

    const approveTrigger = document.getElementById('approveTrigger');
    const modal = new bootstrap.Modal('#approvalModal');
    let isProcessing = false;

    // مدیریت کلیک روی دکمه تأیید
    if(approveTrigger) {
        approveTrigger.addEventListener('click', function() {
            if(isProcessing) return;
            modal.show();
        });
    }

    // مدیریت تأیید نهایی
    document.getElementById('confirmApprove').addEventListener('click', async function() {
        if(isProcessing) return;
        isProcessing = true;
        
        const fileId = approveTrigger?.dataset.fileId;
        if(!fileId) return;

        try {
            // نمایش اسپینر و غیرفعال کردن دکمه‌ها
            approveTrigger.querySelector('.approve-text').style.display = 'none';
            approveTrigger.querySelector('.approve-loader').style.display = 'inline';
            approveTrigger.disabled = true;
            
            const response = await fetch(`{% url 'approve_bge_file' 0 %}`.replace('0', fileId), {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCSRFCookie(),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            });

            const data = await response.json();
            
            if(response.ok && data.status === 'success') {
                window.location.href = "{% url 'logistics_bge_files' %}?approved=true";
            } else {
                showToast('خطا', data.message || 'عملیات تأیید با خطا مواجه شد', 'danger');
            }
        } catch (error) {
            console.error('Error:', error);
            showToast('خطای ارتباط', 'خطا در ارتباط با سرور', 'danger');
        } finally {
            isProcessing = false;
            modal.hide();
            approveTrigger.querySelector('.approve-text').style.display = 'inline';
            approveTrigger.querySelector('.approve-loader').style.display = 'none';
            approveTrigger.disabled = false;
        }
    });

    // تابع نمایش Toast
    function showToast(title, message, type) {
        const toastContainer = document.createElement('div');
        toastContainer.innerHTML = `
            <div class="toast align-items-center text-white bg-${type} border-0" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">
                        <strong>${title}</strong><br>${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            </div>
        `;
        document.body.appendChild(toastContainer);
        bootstrap.Toast.getOrCreateInstance(toastContainer.querySelector('.toast')).show();
    }
});
</script>
{% endblock %}
