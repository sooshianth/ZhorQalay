{% extends 'base.html' %}{% load static %}

{% block title %}آپلود فایل اکسل بازارگاه{% endblock %}
{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/css/select2.min.css">
<style>
.file-upload-wrapper {
position: relative;
width: 100%;
height: 60px;
border: 2px dashed #ccc;
border-radius: 8px;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
cursor: pointer;
transition: all 0.3s ease;
}
.file-upload-wrapper:hover {
border-color: #0d6efd;
}
.file-upload-input {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
opacity: 0;
cursor: pointer;
}
.file-upload-text {
color: #6c757d;
}
.loading-overlay {
display: none;
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: rgba(0, 0, 0, 0.5);
z-index: 1000;
justify-content: center;
align-items: center;
}
.select2-container--default .select2-selection--single {
height: 38px;
padding: 5px;
}
.select2-container--default .select2-selection--single .select2-selection__arrow {
height: 38px;
}
</style>

<div class="container py-5">
<div class="row justify-content-center">
<div class="col-md-8">
<div class="card">
<div class="card-header bg-secondary text-white">
<h3 class="mb-0 text-center">آپلود فایل اکسل بازارگاه</h3>
</div>
<div class="card-body">
<form id="excelUploadForm" enctype="multipart/form-data">
{% csrf_token %}
<div class="mb-4">
<label for="cargoProductSelect" class="form-label">انتخاب محصول:</label>
<select class="form-select" id="cargoProductSelect" name="cargo_id" required>
<option value="">جستجو و انتخاب محصول...</option>
</select>
<div class="form-text">
جستجو بر اساس کوتاژ، نوع محصول یا کشور
</div>
</div>

<div class="mb-4">
<label for="excelFile" class="form-label">فایل اکسل:</label>
<div class="file-upload-wrapper" id="fileUploadWrapper">
<input type="file" class="file-upload-input" id="excelFile" name="excel_file" accept=".xlsx, .xls" required>
<div class="file-upload-text" id="fileUploadText">
برای انتخاب فایل کلیک کنید یا فایل را بکشید و اینجا رها کنید
</div>
</div>
</div>

<div class="d-grid gap-2">
<button type="submit" class="btn btn-primary btn-lg">
<i class="bi bi-upload me-2"></i>آپلود و ثبت
</button>
</div>
</form>
</div>
</div>
</div>
</div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
<div class="spinner-border text-light" role="status">
<span class="visually-hidden">در حال بارگذاری...</span>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/js/select2.min.js"></script>
<script>
$(document).ready(function() {
// Initialize Select2 for better search experience
$('#cargoProductSelect').select2({
placeholder: 'جستجو و انتخاب محصول...',
language: {
noResults: function() {
return "نتیجه‌ای یافت نشد";
},
searching: function() {
return "در حال جستجو...";
}
},
ajax: {
url: "{% url 'search_cargo_products' %}",
dataType: 'json',
delay: 250,
data: function(params) {
return {
q: params.term
};
},
processResults: function(data) {
return {
results: data.results
};
},
cache: true
},
minimumInputLength: 2,
templateResult: formatCargoProduct,
templateSelection: formatCargoProductSelection
});

// File upload handling
$('#excelFile').on('change', function() {
const fileName = this.files[0]?.name || "هیچ فایلی انتخاب نشده";
$('#fileUploadText').text(fileName);

if (this.files[0]) {
$('#fileUploadWrapper').css('border-color', '#28a745');
} else {
$('#fileUploadWrapper').css('border-color', '#ccc');
}
});

// Handle drag and drop
const dropArea = $('#fileUploadWrapper')[0];

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
dropArea.addEventListener(eventName, preventDefaults, false);
});

function preventDefaults(e) {
e.preventDefault();
e.stopPropagation();
}

['dragenter', 'dragover'].forEach(eventName => {
dropArea.addEventListener(eventName, highlight, false);
});

['dragleave', 'drop'].forEach(eventName => {
dropArea.addEventListener(eventName, unhighlight, false);
});

function highlight() {
$('#fileUploadWrapper').css('border-color', '#0d6efd');
$('#fileUploadWrapper').css('background-color', 'rgba(13, 110, 253, 0.1)');
}

function unhighlight() {
$('#fileUploadWrapper').css('border-color', '#ccc');
$('#fileUploadWrapper').css('background-color', 'transparent');
}

dropArea.addEventListener('drop', handleDrop, false);

function handleDrop(e) {
const dt = e.dataTransfer;
const files = dt.files;
$('#excelFile')[0].files = files;
$('#fileUploadText').text(files[0].name);

if (files[0]) {
$('#fileUploadWrapper').css('border-color', '#28a745');
}
}

// Form submission
$('#excelUploadForm').on('submit', function(e) {
e.preventDefault();

const cargoProductId = $('#cargoProductSelect').val();
const file = $('#excelFile')[0].files[0];

if (!cargoProductId) {
alert('لطفاً یک محصول انتخاب کنید');
return;
}

if (!file) {
alert('لطفاً یک فایل اکسل انتخاب کنید');
return;
}

// Show loading overlay
$('#loadingOverlay').css('display', 'flex');

// Create FormData object
const formData = new FormData(this);

// Submit form via AJAX
$.ajax({
url: "{% url 'BGEF' %}",
type: 'POST',
data: formData,
processData: false,
contentType: false,
success: function(response) {
$('#loadingOverlay').css('display', 'none');

// Show success message
alert(response.message);

// Reset form
$('#excelUploadForm')[0].reset();
$('#cargoProductSelect').val('').trigger('change');
$('#fileUploadText').text('برای انتخاب فایل کلیک کنید یا فایل را بکشید و اینجا رها کنید');
$('#fileUploadWrapper').css('border-color', '#ccc');
},
error: function(xhr) {
$('#loadingOverlay').css('display', 'none');

let errorMessage = 'خطایی رخ داده است';
if (xhr.responseJSON && xhr.responseJSON.message) {
errorMessage = xhr.responseJSON.message;
}

alert(errorMessage);
}
});
});
});

// Format cargo product display in dropdown
function formatCargoProduct(product) {
if (!product.id) {
return product.text;
}

return $(`
<div class="d-flex justify-content-between align-items-center">
<div>
<strong>${product.product_type_display || ''}</strong> ${product.country_display || ''} ${product.importer_name || ''}
</div>
<div class="text-muted">
کوتاژ: ${product.cottage || ''}
</div>
</div>
`);
}

// Format selected cargo product
function formatCargoProductSelection(product) {
if (!product.id) {
return product.text;
}

return product.text;
}
</script>

{% endblock %}
